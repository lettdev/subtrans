name: Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            bundle: nsis
            artifact: subtrans-windows-x64
            path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/*-portable.zip
          - name: macOS DMG
            os: macos-latest
            bundle: dmg
            artifact: subtrans-macos-dmg
            path: src-tauri/target/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run check:release

      - name: Build installer
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}

      - name: Package Windows portable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $portableDir = "src-tauri/target/release/portable"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item "src-tauri/target/release/subtrans.exe" "$portableDir/SubTrans.exe"
          @"
          SubTrans $version - Windows x64 portable

          1. Extract this ZIP to a writable folder.
          2. Run SubTrans.exe. No installation is required.

          Requirements:
          - Windows 10/11 x64
          - Microsoft Edge WebView2 Runtime
          - FFmpeg is optional and only needed to create editing proxies

          This build is not code-signed, so Windows SmartScreen may show a warning.
          "@ | Set-Content "$portableDir/README.txt" -Encoding UTF8
          Compress-Archive -Path "$portableDir/*" -DestinationPath "src-tauri/target/release/SubTrans_${version}_windows_x64-portable.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create draft release and upload packages
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-artifacts/**/*

