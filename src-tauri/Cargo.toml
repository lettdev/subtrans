[package]
name = "subtrans"
version = "0.4.0"
description = "A Windows-first subtitle translation and editing workspace"
authors = ["SubTrans contributors"]
edition = "2021"

[lib]
name = "subtrans_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "4.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"

